<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smriti's Job Tracker</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d0f0e' stroke='%231a9e55' stroke-width='1.5'/%3E%3Crect x='5' y='19' width='4' height='4' rx='1' fill='%230d5c30'/%3E%3Crect x='10' y='15' width='4' height='8' rx='1' fill='%231a9e55'/%3E%3Crect x='15' y='10' width='4' height='13' rx='1' fill='%232ecc71'/%3E%3Crect x='20' y='7' width='4' height='16' rx='1' fill='%233ddc84'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d0f0e;
      --surface: #141716;
      --surface2: #1b1e1c;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --text: #f0f5f1;
      --muted: #96a898;
      --accent: #3ddc84;
      --accent2: #1a9e55;
      --accent3: #0d5c30;
      --accent4: #0a3d20;
      --l0: #1b1e1c;
      --l1: #0d5c30;
      --l2: #1a9e55;
      --l3: #2ecc71;
      --l4: #3ddc84;
      --l5: #7fffb3;
      --radius: 6px;
      --font-mono: 'DM Mono', monospace;
      --font-sans: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; min-height: 100vh; padding: 2rem 1.5rem 4rem; }
    header { max-width: 860px; margin: 0 auto 2.5rem; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    header h1 { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: 0.04em; }
    header span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
    .main { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .stats.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .stat-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .stat-value { font-family: var(--font-mono); font-size: 26px; font-weight: 500; color: var(--text); line-height: 1; }
    .stat-value.accent { color: var(--accent); }
    .stat-sub { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 5px; }

    /* Weekly goal history */
    .week-history { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .week-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .week-row { display: flex; align-items: center; gap: 10px; }
    .week-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); width: 90px; flex-shrink: 0; }
    .week-bar-wrap { flex: 1; }
    .week-bar-track { background: var(--surface2); border-radius: 99px; height: 4px; overflow: hidden; }
    .week-bar-fill { height: 100%; border-radius: 99px; background: var(--accent2); transition: width 0.4s ease; }
    .week-bar-fill.hit { background: var(--accent); }
    .week-count { font-family: var(--font-mono); font-size: 11px; color: var(--text); width: 30px; text-align: right; flex-shrink: 0; }
    .week-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 500; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; width: 36px; text-align: center; }
    .week-badge.hit { background: var(--accent4); color: var(--accent); border: 1px solid var(--accent3); }
    .week-badge.miss { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .week-badge.cur { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); font-style: italic; }
    .week-summary { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; gap: 20px; flex-wrap: wrap; }
    .week-summary strong { color: var(--accent); }

    /* Activity rings */
    :root {
      --ring-daily: #ff453a;
      --ring-weekly: #ffd60a;
      --ring-monthly: #3ddc84;
    }
    .rings-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
    .rings-svg-wrap { position: relative; flex-shrink: 0; }
    .rings-svg-wrap svg { display: block; }
    .ring-track { fill: none; stroke-linecap: round; }
    .ring-fill  { fill: none; stroke-linecap: round; transform-origin: 110px 110px; transform: rotate(-90deg); transition: stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1); }
    .ring-hover { fill: none; stroke: transparent; stroke-width: 28; cursor: crosshair; transform-origin: 110px 110px; transform: rotate(-90deg); }
    .ring-tooltip { position: absolute; background: #1e2220; border: 1px solid var(--border2); border-radius: 6px; padding: 8px 12px; font-family: var(--font-mono); font-size: 12px; color: var(--text); pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 20; top: 50%; transform: translateY(-50%); left: calc(100% + 12px); }
    .ring-tooltip.visible { opacity: 1; }
    .ring-tooltip-val { font-size: 20px; font-weight: 500; }
    .ring-tooltip-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .ring-tooltip-msg { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .rings-legend { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 220px; }
    .ring-leg { display: flex; flex-direction: column; gap: 3px; }
    .ring-leg-row { display: flex; align-items: center; gap: 8px; }
    .ring-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .ring-leg-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); flex-shrink: 0; width: 46px; }
    .ring-leg-nums { font-family: var(--font-mono); font-size: 15px; font-weight: 500; line-height: 1; }
    .ring-leg-pct { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
    .ring-leg-msg { font-family: var(--font-mono); font-size: 10px; color: var(--muted); padding-left: 15px; }
    .ring-inputs { display: flex; align-items: center; gap: 5px; margin-left: auto; }
    .goal-input { width: 46px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 4px; color: var(--text); font-family: var(--font-mono); font-size: 11px; padding: 2px 5px; outline: none; text-align: center; }
    .goal-input:focus { border-color: var(--accent); }
    .goal-set-btn { font-family: var(--font-mono); font-size: 10px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border2); background: transparent; color: var(--muted); cursor: pointer; transition: color 0.15s; flex-shrink: 0; }
    .goal-set-btn:hover { color: var(--text); border-color: var(--accent2); }
    /* Range pills */
    .range-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .range-pill { font-family: var(--font-mono); font-size: 10px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--border2); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .range-pill:hover { color: var(--text); }
    .range-pill.active { background: var(--accent4); border-color: var(--accent2); color: var(--accent); }
    /* Streak */
    .streak-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .streak-item { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; }
    .streak-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .streak-dot.cold { background: var(--muted); }
    .streak-num { font-size: 16px; font-weight: 500; color: var(--accent); }
    .streak-num.cold { color: var(--muted); }
    .streak-label { color: var(--muted); }

    /* Log row */
    .log-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .log-label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 4px; }
    input[type="date"], input[type="number"] { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: var(--font-mono); font-size: 13px; padding: 8px 12px; outline: none; transition: border-color 0.15s; color-scheme: dark; }
    input[type="number"] { width: 70px; text-align: center; }
    input:focus { border-color: var(--accent); }
    .btn-log { background: var(--accent3); border: 1px solid var(--accent2); border-radius: var(--radius); color: var(--accent); font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.04em; padding: 8px 18px; cursor: pointer; transition: background 0.15s, transform 0.1s; }
    .btn-log:hover { background: var(--accent4); }
    .btn-log:active { transform: scale(0.97); }
    .btn-set { background: transparent; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--muted); font-family: var(--font-mono); font-size: 11px; padding: 8px 12px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .btn-set:hover { color: var(--text); }
    .toast { font-family: var(--font-mono); font-size: 12px; color: var(--accent); opacity: 0; transition: opacity 0.3s; padding-left: 4px; }
    .toast.show { opacity: 1; }
    .file-status { font-family: var(--font-mono); font-size: 10px; color: var(--muted); padding-left: 2px; white-space: nowrap; }
    .file-status.ok { color: var(--accent2); }
    .file-status.err { color: #f0a500; }

    /* Grid */
    .grid-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .month-block { margin-bottom: 20px; }
    .month-block:last-child { margin-bottom: 0; }
    .month-header { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
    .day-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .day-cell { width: 28px; height: 28px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 9px; cursor: pointer; position: relative; transition: transform 0.1s, outline 0.1s; outline: 1.5px solid transparent; }
    .day-cell:hover { transform: scale(1.2); z-index: 2; outline: 1.5px solid rgba(255,255,255,0.25); }
    .day-cell:active { transform: scale(0.95); }
    .day-cell.l0 { background: var(--l0); color: var(--muted); }
    .day-cell.l1 { background: var(--l1); color: #7fd1a0; }
    .day-cell.l2 { background: var(--l2); color: #c8ffe0; }
    .day-cell.l3 { background: var(--l3); color: #073d1f; }
    .day-cell.l4 { background: var(--l4); color: #073d1f; }
    .day-cell.l5 { background: var(--l5); color: #073d1f; }
    .day-cell.today { outline: 1.5px solid var(--accent); }
    .tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #222; border: 1px solid var(--border2); border-radius: 4px; padding: 5px 9px; white-space: nowrap; font-size: 11px; color: var(--text); pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 10; }
    .day-cell:hover .tip { opacity: 1; }

    /* Charts */
    .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .section-title { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
    .chart-container { position: relative; width: 100%; height: 180px; }

    /* Tabs */
    .tab-nav { max-width: 860px; margin: 0 auto 2rem; display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
    .tab-btn { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); background: transparent; border: none; padding: 8px 18px 10px; cursor: pointer; position: relative; transition: color 0.15s; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
    .tab-pane { display: none; flex-direction: column; gap: 1.5rem; }
    .tab-pane.active { display: flex; }

    /* Day-rings modal */
    .day-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .day-modal.visible { display: flex; }
    .day-modal-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 24px; max-width: 500px; width: 100%; position: relative; display: flex; flex-direction: column; gap: 18px; }
    .day-modal-close { position: absolute; top: 10px; right: 14px; background: transparent; border: none; color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; padding: 0; }
    .day-modal-close:hover { color: var(--text); }
    .day-modal-title { font-family: var(--font-mono); font-size: 13px; color: var(--accent); letter-spacing: 0.03em; }
    .day-modal-body { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .day-modal-body .rings-legend { min-width: 200px; }
    .day-modal-foot { display: flex; gap: 8px; }

    @media (max-width: 600px) {
      .stats, .stats.cols-3 { grid-template-columns: repeat(2, 1fr); }
      header { flex-direction: column; gap: 4px; }
      .week-label { width: 70px; }
      .tab-btn { padding: 8px 12px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>

<header>
  <h1>eat-pray-apply</h1>
  <span id="header-date"></span>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('log')">log</button>
  <button class="tab-btn" onclick="switchTab('history')">history</button>
  <button class="tab-btn" onclick="switchTab('stats')">stats</button>
</nav>

<main class="main">

  <!-- ── Tab: Log ── -->
  <div class="tab-pane active" id="pane-log">

  <!-- Activity rings -->
  <div class="rings-wrap">
    <div class="rings-svg-wrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <defs>
          <filter id="tip-shadow" x="-100%" y="-100%" width="300%" height="300%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.9)"/>
          </filter>
        </defs>
        <!-- monthly track + fill (outer, r=95, C≈597) -->
        <circle class="ring-track" cx="110" cy="110" r="95" stroke="#3ddc8422" stroke-width="16"/>
        <circle class="ring-fill"  cx="110" cy="110" r="95" stroke="#3ddc84" stroke-width="16" id="ring-monthly" stroke-dasharray="597" stroke-dashoffset="597"/>
        <!-- weekly track + fill (middle, r=72, C≈452) -->
        <circle class="ring-track" cx="110" cy="110" r="72" stroke="#ffd60a22" stroke-width="16"/>
        <circle class="ring-fill"  cx="110" cy="110" r="72" stroke="#ffd60a"  stroke-width="16" id="ring-weekly"  stroke-dasharray="452" stroke-dashoffset="452"/>
        <!-- daily track + fill (inner, r=49, C≈308) -->
        <circle class="ring-track" cx="110" cy="110" r="49" stroke="#ff453a22" stroke-width="16"/>
        <circle class="ring-fill"  cx="110" cy="110" r="49" stroke="#ff453a"  stroke-width="16" id="ring-daily"   stroke-dasharray="308" stroke-dashoffset="308"/>
        <!-- overflow markers: bright dot + white shimmer at the overflow position when ring > 100% -->
        <circle id="ring-monthly-tip"   r="9"   fill="#44e890" visibility="hidden" filter="url(#tip-shadow)"/>
        <circle id="ring-weekly-tip"    r="9"   fill="#ffe033" visibility="hidden" filter="url(#tip-shadow)"/>
        <circle id="ring-daily-tip"     r="9"   fill="#ff6259" visibility="hidden" filter="url(#tip-shadow)"/>
        <circle id="ring-monthly-shine" r="3.5" fill="rgba(255,255,255,0.45)" visibility="hidden"/>
        <circle id="ring-weekly-shine"  r="3.5" fill="rgba(255,255,255,0.45)" visibility="hidden"/>
        <circle id="ring-daily-shine"   r="3.5" fill="rgba(255,255,255,0.45)" visibility="hidden"/>
        <!-- hover zones -->
        <circle class="ring-hover" cx="110" cy="110" r="95" onmouseenter="showRingTip('monthly')" onmouseleave="hideRingTip()"/>
        <circle class="ring-hover" cx="110" cy="110" r="72" onmouseenter="showRingTip('weekly')"  onmouseleave="hideRingTip()"/>
        <circle class="ring-hover" cx="110" cy="110" r="49" onmouseenter="showRingTip('daily')"   onmouseleave="hideRingTip()"/>
        <!-- center text -->
        <text x="110" y="104" text-anchor="middle" font-family="'DM Mono',monospace" font-size="11" fill="#96a898" letter-spacing="1">TODAY</text>
        <text x="110" y="124" text-anchor="middle" font-family="'DM Mono',monospace" font-size="22" font-weight="500" fill="#f0f5f1" id="ring-center-val">0</text>
      </svg>
      <div class="ring-tooltip" id="ring-tooltip">
        <div class="ring-tooltip-label" id="rtt-label"></div>
        <div class="ring-tooltip-val" id="rtt-val"></div>
        <div class="ring-tooltip-msg" id="rtt-msg"></div>
      </div>
    </div>
    <div class="rings-legend">
      <!-- daily -->
      <div class="ring-leg">
        <div class="ring-leg-row">
          <div class="ring-dot" style="background:#ff453a"></div>
          <span class="ring-leg-label">Daily</span>
          <span class="ring-leg-nums" style="color:#ff453a" id="rleg-daily-nums">0 / —</span>
          <span class="ring-leg-pct" id="rleg-daily-pct"></span>
          <div class="ring-inputs">
            <input type="number" class="goal-input" id="goal-input-daily" min="1" max="999" placeholder="—" />
            <button class="goal-set-btn" onclick="saveGoal('daily')">set</button>
          </div>
        </div>
        <div class="ring-leg-msg" id="rleg-daily-msg"></div>
      </div>
      <!-- weekly -->
      <div class="ring-leg">
        <div class="ring-leg-row">
          <div class="ring-dot" style="background:#ffd60a"></div>
          <span class="ring-leg-label">Weekly</span>
          <span class="ring-leg-nums" style="color:#ffd60a" id="rleg-weekly-nums">0 / —</span>
          <span class="ring-leg-pct" id="rleg-weekly-pct"></span>
          <div class="ring-inputs">
            <input type="number" class="goal-input" id="goal-input-weekly" min="1" max="999" placeholder="—" />
            <button class="goal-set-btn" onclick="saveGoal('weekly')">set</button>
          </div>
        </div>
        <div class="ring-leg-msg" id="rleg-weekly-msg"></div>
      </div>
      <!-- monthly -->
      <div class="ring-leg">
        <div class="ring-leg-row">
          <div class="ring-dot" style="background:#3ddc84"></div>
          <span class="ring-leg-label">Monthly</span>
          <span class="ring-leg-nums" style="color:#3ddc84" id="rleg-monthly-nums">0 / —</span>
          <span class="ring-leg-pct" id="rleg-monthly-pct"></span>
          <div class="ring-inputs">
            <input type="number" class="goal-input" id="goal-input-monthly" min="1" max="999" placeholder="—" />
            <button class="goal-set-btn" onclick="saveGoal('monthly')">set</button>
          </div>
        </div>
        <div class="ring-leg-msg" id="rleg-monthly-msg"></div>
      </div>
    </div>
  </div>

  <div class="streak-bar" id="streak-bar"></div>

  <div class="log-row">
    <span class="log-label">Log</span>
    <input type="date" id="inp-date" />
    <input type="number" id="inp-count" value="1" min="0" max="99" />
    <button class="btn-log" onclick="logApps()">+ add</button>
    <button class="btn-set" onclick="setApps()">set exact</button>
    <button class="btn-set" onclick="exportCSV()">export csv</button>
    <button class="btn-set" id="btn-sync" onclick="pickSyncFile()" title="Connect a CSV file on your disk — app will auto-save to it">sync file</button>
    <span class="file-status" id="file-status"></span>
    <span class="toast" id="toast"></span>
  </div>

  <!-- quick summary strip on log tab -->
  <div class="stats" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><div class="stat-label">Total apps</div><div class="stat-value accent" id="s-total">0</div></div>
    <div class="stat"><div class="stat-label">This week</div><div class="stat-value" id="s-week">0</div><div class="stat-sub" id="s-trend" style="font-size:11px;margin-top:3px"></div></div>
    <div class="stat"><div class="stat-label">Best day</div><div class="stat-value" id="s-best">0</div></div>
    <div class="stat"><div class="stat-label">Best week</div><div class="stat-value" id="s-bestweekval">0</div></div>
  </div>

  </div><!-- end pane-log -->

  <!-- ── Tab: History ── -->
  <div class="tab-pane" id="pane-history">

  <div class="grid-wrap" id="grid-wrap"></div>

  <div class="week-history">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">

<script>
const SEED = {
  "2026-03-19":18,"2026-03-21":6,"2026-03-22":11,"2026-03-23":6,
  "2026-03-24":15,"2026-03-25":20,"2026-03-26":14,"2026-03-27":1,
  "2026-03-30":4,"2026-03-31":1,
  "2026-04-21":1,
  "2026-05-06":5,"2026-05-07":3,"2026-05-11":12,"2026-05-13":1,
  "2026-05-14":10,"2026-05-15":9,"2026-05-16":16,"2026-05-19":1,
  "2026-05-22":11,"2026-05-23":1,"2026-05-24":2,
  "2026-05-25":15,"2026-05-26":16,"2026-05-27":11,"2026-05-28":2,
  "2026-05-29":11,
  "2026-06-01":11,"2026-06-10":16,"2026-06-13":19,"2026-06-14":12,"2026-06-15":16
};

const STORE_KEY = "smriti_job_tracker_v1";
const GOAL_KEY  = "smriti_job_tracker_goal_v1";
const GOALHIST_KEY = "smriti_job_tracker_goalhist_v1";

let data = {};
let goal = { daily: 10, weekly: 30, monthly: 100 };
// Chronological log of goal snapshots. Each entry = the full goal set as of `date`.
// Past days/weeks are judged against the goal active back then, so changing a
// goal today never rewrites history. Sorted ascending by date.
let goalHistory = [];
let weeklyChart = null;
let monthlyChart = null;

/* ── File Sync (File System Access API) ── */
let syncFileHandle = null;

function openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("epa_sync", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("handles");
    req.onsuccess = e => res(e.target.result);
    req.onerror = rej;
  });
}
async function idbGet(key) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("handles", "readonly");
    const req = tx.objectStore("handles").get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = rej;
  });
}
async function idbSet(key, val) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(val, key);
    tx.oncomplete = res;
    tx.onerror = rej;
  });
}

function csvToData(text) {
  const out = {};
  text.trim().split("\n").slice(1).forEach(line => {
    const [date, count] = line.split(",");
    if (date && count && date.match(/^\d{4}-\d{2}-\d{2}$/)) {
      const n = parseInt(count);
      if (n > 0) out[date.trim()] = n;
    }
  });
  return out;
}
function dataToCSV(d) {
  const rows = [["date","applications"]];
  Object.keys(d).filter(k => d[k] > 0).sort().forEach(k => rows.push([k, d[k]]));
  return rows.map(r => r.join(",")).join("\n");
}

function setFileStatus(msg, cls) {
  const el = document.getElementById("file-status");
  el.textContent = msg;
  el.className = "file-status" + (cls ? " " + cls : "");
}

async function tryRestoreFileHandle() {
  if (!window.showOpenFilePicker) return;
  try {
    const fh = await idbGet("syncFile");
    if (!fh) return;
    const perm = await fh.queryPermission({ mode: "readwrite" });
    if (perm === "granted") {
      syncFileHandle = fh;
      await loadFromFile();
    } else if (perm === "prompt") {
      syncFileHandle = fh;
      setFileStatus("● click to reconnect → " + fh.name, "err");
      document.getElementById("btn-sync").textContent = "reconnect";
    }
  } catch(e) {}
}

async function loadFromFile() {
  if (!syncFileHandle) return false;
  try {
    const file = await syncFileHandle.getFile();
    const text = await file.text();
    const parsed = csvToData(text);
    if (Object.keys(parsed).length > 0) {
      data = parsed;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e) {}
    }
    setFileStatus("● " + syncFileHandle.name, "ok");
    document.getElementById("btn-sync").textContent = "synced ✓";
    return true;
  } catch(e) {
    setFileStatus("read error", "err");
    return false;
  }
}

async function writeToFile() {
  if (!syncFileHandle) return;
  try {
    const perm = await syncFileHandle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted") return;
    const writable = await syncFileHandle.createWritable();
    await writable.write(dataToCSV(data));
    await writable.close();
  } catch(e) {}
}

async function pickSyncFile() {
  if (!window.showOpenFilePicker) {
    alert("File System Access API is not supported in this browser. Use Chrome or Edge.");
    return;
  }
  try {
    const [fh] = await window.showOpenFilePicker({
      types: [{ description: "CSV", accept: { "text/csv": [".csv"] } }],
      multiple: false
    });
    syncFileHandle = fh;
    await idbSet("syncFile", fh);
    const loaded = await loadFromFile();
    if (loaded) {
      render();
      showToast("synced from " + fh.name);
    }
  } catch(e) {
    if (e.name !== "AbortError") setFileStatus("error picking file", "err");
  }
}

/* ── Storage ── */
function load() {
  try { const r = localStorage.getItem(STORE_KEY); data = r ? JSON.parse(r) : {...SEED}; } catch(e) { data = {...SEED}; }
  try { const g = localStorage.getItem(GOAL_KEY);  if (g) goal = JSON.parse(g); } catch(e) {}
  try { const gh = localStorage.getItem(GOALHIST_KEY); if (gh) goalHistory = JSON.parse(gh); } catch(e) {}
  if (!Array.isArray(goalHistory) || !goalHistory.length) seedGoalHistory();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e) {}
  writeToFile();
}
function saveGoalStore() {
  try { localStorage.setItem(GOAL_KEY, JSON.stringify(goal)); } catch(e) {}
}
function saveGoalHistStore() {
  try { localStorage.setItem(GOALHIST_KEY, JSON.stringify(goalHistory)); } catch(e) {}
}

// One-time backfill of goal history from the current goal. Preserves the known
// daily 10 → current change made on 2026-07-01 so past hits aren't rewritten.
function seedGoalHistory() {
  const keys = Object.keys(data).filter(k => data[k] > 0).sort();
  const baseDate = keys.length ? keys[0] : today();
  const cur = { daily: goal.daily || 0, weekly: goal.weekly || 0, monthly: goal.monthly || 0 };
  if (cur.daily !== 10 && baseDate < "2026-07-01") {
    goalHistory = [
      { date: baseDate,     daily: 10, weekly: cur.weekly, monthly: cur.monthly },
      { date: "2026-07-01", daily: cur.daily, weekly: cur.weekly, monthly: cur.monthly }
    ];
  } else {
    goalHistory = [ { date: baseDate, ...cur } ];
  }
  saveGoalHistStore();
}

// Goal set in effect on a given YYYY-MM-DD (latest snapshot whose date <= key;
// falls back to the earliest snapshot for dates before any record).
function goalOn(dateKey) {
  if (!goalHistory.length) return goal;
  let result = goalHistory[0];
  for (const entry of goalHistory) {
    if (entry.date <= dateKey) result = entry; else break;
  }
  return result;
}

// Snapshot the current goal set as of today. Called whenever any goal changes.
function recordGoalChange() {
  const t = today();
  const snap = { date: t, daily: goal.daily || 0, weekly: goal.weekly || 0, monthly: goal.monthly || 0 };
  const last = goalHistory[goalHistory.length - 1];
  if (last && last.date === t) goalHistory[goalHistory.length - 1] = snap;
  else goalHistory.push(snap);
  saveGoalHistStore();
}

/* ── Helpers ── */
function toKey(d) { return d.toISOString().slice(0,10); }
function today() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
}

function getLevel(n) {
  if (!n) return "l0";
  if (n <= 3)  return "l1";
  if (n <= 8)  return "l2";
  if (n <= 14) return "l3";
  if (n <= 18) return "l4";
  return "l5";
}

// Parse a YYYY-MM-DD string as local noon — avoids UTC-midnight rolling date back one day in US timezones
function parseDate(str) { return new Date(str + "T12:00:00"); }
// Format a Date as YYYY-MM-DD in local time
function fmtDate(d) { return d.toLocaleDateString('en-CA'); }

function getWeekStart(d) {
  const dt = d ? parseDate(d) : new Date();
  const day = dt.getDay();
  dt.setDate(dt.getDate() - (day === 0 ? 6 : day - 1));
  return fmtDate(dt);
}

/* ── Goal / Rings ── */
const RING_C = { daily: 308, weekly: 452, monthly: 597 };

function saveGoal(type) {
  const v = parseInt(document.getElementById("goal-input-"+type).value);
  if (!v || v < 1) return;
  goal[type] = v;
  saveGoalStore();
  recordGoalChange();
  updateGoal();
  updateStats();
  buildWeeklyGoalHistory();
  showToast(type + " goal saved");
}

function setRing(type, pct) {
  const c = RING_C[type];
  const offset = c - Math.min(1, pct / 100) * c;
  document.getElementById("ring-"+type).style.strokeDashoffset = offset;
  const RING_R = { daily: 49, weekly: 72, monthly: 95 };
  const tip   = document.getElementById("ring-"+type+"-tip");
  const shine = document.getElementById("ring-"+type+"-shine");
  if (pct >= 100) {
    // Position overflow marker dot at the overflow angle (how far past 100%)
    const r = RING_R[type];
    const overflowDeg = (pct % 100) / 100 * 360;
    const angle = (-90 + overflowDeg) * Math.PI / 180;
    const tx = 110 + r * Math.cos(angle);
    const ty = 110 + r * Math.sin(angle);
    if (tip)   { tip.setAttribute("cx", tx); tip.setAttribute("cy", ty); tip.setAttribute("visibility", "visible"); }
    if (shine) { shine.setAttribute("cx", tx - 2.5); shine.setAttribute("cy", ty - 2.5); shine.setAttribute("visibility", "visible"); }
  } else {
    if (tip)   tip.setAttribute("visibility", "hidden");
    if (shine) shine.setAttribute("visibility", "hidden");
  }
}

function timeLeftMsg(type, now) {
  if (type === "daily") {
    const h = 23 - now.getHours(), m = 59 - now.getMinutes();
    return h > 0 ? `${h}h ${m}m left` : `${m}m left`;
  } else if (type === "weekly") {
    const dow = (now.getDay() + 6) % 7;
    const d = 6 - dow;
    return d === 0 ? "last day" : `${d}d left`;
  } else {
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const d = last - now.getDate();
    return d === 0 ? "last day" : `${d}d left`;
  }
}

function updateGoal() {
  const now = new Date();
  const dailyCurrent   = data[today()] || 0;
  const ws = getWeekStart();
  const weeklyCurrent  = Object.entries(data).filter(([k,v]) => k >= ws && v > 0).reduce((a,[,v])=>a+v, 0);
  const prefix = today().slice(0,7);
  const monthlyCurrent = Object.entries(data).filter(([k,v]) => k.startsWith(prefix) && v > 0).reduce((a,[,v])=>a+v, 0);

  document.getElementById("ring-center-val").textContent = dailyCurrent;

  [["daily", dailyCurrent], ["weekly", weeklyCurrent], ["monthly", monthlyCurrent]].forEach(([type, current]) => {
    const target = goal[type] || 0;
    const rawPct = target > 0 ? Math.round(current / target * 100) : 0;
    const pct    = Math.min(100, rawPct);
    setRing(type, rawPct);

    document.getElementById("goal-input-"+type).value = target || "";
    document.getElementById("rleg-"+type+"-nums").textContent = `${current} / ${target || "—"}`;
    document.getElementById("rleg-"+type+"-pct").textContent  = target > 0 ? pct+"%" : "";

    let msg = "";
    if (!target) { msg = "no target set"; }
    else if (pct >= 100) { msg = "🎉 goal hit!"; }
    else {
      const left = target - current;
      const tl   = timeLeftMsg(type, now);
      let behind = "";
      if (type === "daily") {
        const h = 23 - now.getHours(), m = 59 - now.getMinutes();
        if (h > 0) behind = ` · ${(left/(h+m/60)).toFixed(1)}/hr`;
      } else if (type === "weekly") {
        const dow = (now.getDay()+6)%7, d = 6-dow;
        if (d > 0) behind = ` · ${Math.ceil(left/(d+1))}/day`;
      } else {
        const last = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
        const d = last - now.getDate();
        if (d > 0) behind = ` · ${Math.ceil(left/(d+1))}/day`;
      }
      msg = `${left} left · ${tl}${behind}`;
      if (type === "weekly" && current > 0) {
        const proj = Math.round(current / (((now.getDay() + 6) % 7) + 1) * 7);
        msg += ` · ~${proj} by Sun`;
      }
    }
    document.getElementById("rleg-"+type+"-msg").textContent = msg;
    updateRingTipData(type, current, target, msg);
  });
}

/* ── Stats ── */
function getWeekTotal(mondayKey) {
  let total = 0;
  const start = parseDate(mondayKey);
  for (let d = 0; d < 7; d++) {
    const day = new Date(start);
    day.setDate(day.getDate() + d);
    total += data[fmtDate(day)] || 0;
  }
  return total;
}

function getAllWeekMondays() {
  const keys = Object.keys(data).filter(k => data[k] > 0).sort();
  if (!keys.length) return [];
  const todayMondayStr = getWeekStart();
  const cur = parseDate(getWeekStart(keys[0]));
  const mondays = [];
  while (fmtDate(cur) <= todayMondayStr) {
    mondays.push(fmtDate(new Date(cur)));
    cur.setDate(cur.getDate() + 7);
  }
  return mondays;
}

function updateStats() {
  const now = new Date();
  const vals = Object.values(data).filter(v => v > 0);
  const total = vals.reduce((a,b)=>a+b,0);
  const bestDay = vals.length ? Math.max(...vals) : 0;
  document.getElementById("s-total").textContent = total;
  document.getElementById("s-days").textContent  = vals.length;
  document.getElementById("s-best").textContent  = bestDay;
  document.getElementById("ss-total").textContent = total;
  document.getElementById("ss-best").textContent  = bestDay;

  const avgPerDay = vals.length ? (total / vals.length).toFixed(1) : 0;
  document.getElementById("s-avg").textContent = vals.length ? `avg ${avgPerDay}/day` : "";

  const ws = getWeekStart();
  const weekSum = Object.entries(data).filter(([k,v]) => k >= ws && v > 0).reduce((a,[,v])=>a+v, 0);
  document.getElementById("s-week").textContent  = weekSum;
  document.getElementById("ss-week").textContent = weekSum;

  // Benchmark shared by the trend arrow and the "vs Nwk avg" line: the average
  // weekly total over the last 4 completed weeks (fewer while still ramping up).
  const mondays = getAllWeekMondays();
  const recentWeeks = mondays.filter(m => m < ws).slice(-4);
  const avgRecent = recentWeeks.length ? recentWeeks.reduce((a,m) => a + getWeekTotal(m), 0) / recentWeeks.length : 0;

  // Trend arrow: this week's per-day pace vs the recent weekly average on the same
  // per-day basis (avgRecent/7), so early-week days aren't unfairly "below avg".
  const daysIntoWeek = Math.max(1, (now.getDay() + 6) % 7 + 1);
  const thisWeekPace = weekSum / daysIntoWeek;
  const trendEl = document.getElementById("s-trend");
  if (trendEl && recentWeeks.length > 0 && avgRecent > 0) {
    const ratio = thisWeekPace / (avgRecent / 7);
    if (ratio >= 1.1)       { trendEl.textContent = "↑ above avg"; trendEl.style.color = "var(--accent)"; }
    else if (ratio <= 0.9)  { trendEl.textContent = "↓ below avg"; trendEl.style.color = "#f0a500"; }
    else                    { trendEl.textContent = "→ on avg";    trendEl.style.color = "var(--muted)"; }
  } else if (trendEl) { trendEl.textContent = ""; }

  // Weekly pace projection: at the current pace, where the week lands by Sunday
  const wPaceEl = document.getElementById("s-wpace");
  if (wPaceEl) {
    if (weekSum > 0) {
      const wProjected = Math.round(weekSum / daysIntoWeek * 7);
      wPaceEl.textContent = wProjected;
      const wGoalNow = goal.weekly || 0;
      document.getElementById("s-wpace-sub").textContent =
        wGoalNow > 0 ? (wProjected >= wGoalNow ? "on track ✓" : `goal: ${wGoalNow}`) : "proj. this week";
    } else {
      wPaceEl.textContent = "—";
      document.getElementById("s-wpace-sub").textContent = "proj. this week";
    }
  }

  // best week
  let bestWeek = 0;
  mondays.forEach(m => { const t = getWeekTotal(m); if (t > bestWeek) bestWeek = t; });
  document.getElementById("s-bestweekval").textContent  = bestWeek;
  document.getElementById("ss-bestweekval").textContent = bestWeek;

  // this week vs the recent weekly average computed above
  const sbEl = document.getElementById("s-bestweek");
  if (recentWeeks.length > 0) {
    const diff = weekSum - avgRecent;
    const mag = Math.round(Math.abs(diff));
    const lbl = `${recentWeeks.length}wk avg`;
    if (mag === 0)     sbEl.textContent = `→ on ${lbl}`;
    else if (diff > 0) sbEl.textContent = `↑ ${mag} vs ${lbl}`;
    else               sbEl.textContent = `↓ ${mag} vs ${lbl}`;
  } else {
    sbEl.textContent = "";
  }

  // Weekly goal streak: consecutive most-recent weeks meeting their weekly goal.
  // The in-progress week counts once it has already hit; a missed completed week ends it.
  const wGoalNow = goal.weekly || 0;
  const completedMondays = mondays.filter(m => m < ws);
  const weekHit = m => { const g = goalOn(m).weekly || 0; return g > 0 && getWeekTotal(m) >= g; };
  const wkStreakEl  = document.getElementById("s-wkstreak");
  const wkStreakSub = document.getElementById("s-wkstreak-sub");
  if (wGoalNow === 0) {
    wkStreakEl.textContent = "—";
    wkStreakSub.textContent = "set weekly goal";
  } else {
    let streak = 0;
    for (let i = mondays.length - 1; i >= 0; i--) {
      const m = mondays[i];
      if (weekHit(m)) streak++;
      else if (m === ws) continue;  // current week still in progress — don't break the chain
      else break;                   // a completed week missed — streak ends
    }
    wkStreakEl.textContent = streak;
    const hitCount = completedMondays.filter(weekHit).length;
    wkStreakSub.textContent = completedMondays.length > 0
      ? `${hitCount}/${completedMondays.length} wks hit`
      : "first week in progress";
  }
}

/* ── Weekly goal history ── */
let historyRange = 6;

function setHistoryRange(n) {
  historyRange = n;
  document.querySelectorAll(".range-pill").forEach(el => {
    el.classList.toggle("active", parseInt(el.dataset.range) === n);
  });
  buildWeeklyGoalHistory();
}

function buildWeeklyGoalHistory() {
  const wGoal = goal.weekly || 0;
  const todayMonday = getWeekStart();

  // 1w = per-day view of the current week
  if (historyRange === 1) {
    const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const dGoal = goal.daily || 0;
    // Each day judged against the daily goal that was active on that day.
    const dayGoals = Array.from({length:7},(_,i)=>{
      const d=new Date(todayMonday+"T12:00:00"); d.setDate(d.getDate()+i); return goalOn(toKey(d)).daily||0;
    });
    const maxVal = Math.max(...dayGoals, ...Array.from({length:7},(_,i)=>{
      const d=new Date(todayMonday+"T12:00:00"); d.setDate(d.getDate()+i); return data[toKey(d)]||0;
    }), 1);
    let rowsHtml = '';
    const todayKey = today();
    for (let i = 0; i < 7; i++) {
      const d = new Date(todayMonday+"T12:00:00"); d.setDate(d.getDate()+i);
      const key = toKey(d);
      const count = data[key] || 0;
      const dGoalDay = dayGoals[i];
      const isFuture = key > todayKey;
      const isToday = key === todayKey;
      const pct = Math.min(100, Math.round(count / maxVal * 100));
      const isHit = dGoalDay > 0 && count >= dGoalDay;
      const fillClass = isHit ? ' hit' : '';
      const goalMarker = dGoalDay > 0 ? `<div style="position:absolute;top:-2px;bottom:-2px;left:${Math.min(100,Math.round(dGoalDay/maxVal*100))}%;width:1px;background:var(--border2)"></div>` : '';
      const badge = isToday ? `<div class="week-badge cur">today</div>` : isFuture ? `<div class="week-badge miss" style="opacity:0.3">—</div>` : isHit ? `<div class="week-badge hit">hit</div>` : `<div class="week-badge miss">miss</div>`;
      rowsHtml += `<div class="week-row" style="${isFuture?'opacity:0.35':''}">
        <div class="week-label">${dayNames[i]} ${d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</div>
        <div class="week-bar-wrap"><div class="week-bar-track" style="position:relative"><div class="week-bar-fill${fillClass}" style="width:${pct}%"></div>${goalMarker}</div></div>
        <div class="week-count">${count || ''}</div>
        ${badge}
      </div>`;
    }
    document.getElementById("week-history-rows").innerHTML = rowsHtml;
    const weekTotal = Array.from({length:7},(_,i)=>{const d=new Date(todayMonday+"T12:00:00");d.setDate(d.getDate()+i);return data[toKey(d)]||0;}).reduce((a,b)=>a+b,0);
    let summaryHtml = `<span>this week: <strong>${weekTotal}</strong> apps</span>`;
    if (wGoal > 0) summaryHtml += `<span>weekly goal: <strong>${wGoal}</strong> · ${weekTotal>=wGoal?'<strong style="color:var(--accent)">hit 🎉</strong>':`${wGoal-weekTotal} to go`}</span>`;
    if (dGoal > 0) summaryHtml += `<span>daily goal: <strong>${dGoal}</strong>/day</span>`;
    document.getElementById("week-summary").innerHTML = summaryHtml;
    return;
  }

  // collect all weeks with data, going back as far as needed
  const allMondays = getAllWeekMondays();
  // limit to historyRange most recent (including current week)
  const sliced = allMondays.slice(-Math.min(historyRange, allMondays.length));

  const rows = sliced.map(monday => {
    const d = new Date(monday + "T12:00:00");
    const sunday = new Date(d); sunday.setDate(sunday.getDate() + 6);
    const total = getWeekTotal(monday);
    const isCurrent = monday === todayMonday;
    const label = d.toLocaleDateString("en-US", {month:"short", day:"numeric"}) +
      " – " + sunday.toLocaleDateString("en-US", {month:"short", day:"numeric"});
    return { monday, label, total, isCurrent };
  });

  // weekly goal in effect for each week (looked up by its Monday)
  rows.forEach(r => { r.wGoal = goalOn(r.monday).weekly || 0; r.isHit = r.wGoal > 0 && r.total >= r.wGoal; });
  const maxTotal = Math.max(...rows.map(r => r.total), ...rows.map(r => r.wGoal), 1);
  // A week counts toward the tally once it's assessable: any completed week, or
  // the current week once it has already crossed its goal.
  const assessed = rows.filter(r => !r.isCurrent || r.isHit);
  const hitCount = assessed.filter(r => r.isHit).length;

  const rowsHtml = rows.map(r => {
    const pct = Math.min(100, Math.round(r.total / maxTotal * 100));
    const isHit = r.isHit;
    const badgeClass = isHit ? "hit" : r.isCurrent ? "cur" : "miss";
    const badgeText  = isHit ? "hit" : r.isCurrent ? "now" : "miss";
    const fillClass  = isHit ? " hit" : "";
    const goalMarker = r.wGoal > 0 ? `<div style="position:absolute;top:-2px;bottom:-2px;left:${Math.min(100,Math.round(r.wGoal/maxTotal*100))}%;width:1px;background:var(--border2)"></div>` : "";
    return `<div class="week-row">
      <div class="week-label">${r.label}</div>
      <div class="week-bar-wrap">
        <div class="week-bar-track" style="position:relative">
          <div class="week-bar-fill${fillClass}" style="width:${pct}%"></div>
          ${goalMarker}
        </div>
      </div>
      <div class="week-count">${r.total || ""}</div>
      <div class="week-badge ${badgeClass}">${badgeText}</div>
    </div>`;
  }).join("");

  document.getElementById("week-history-rows").innerHTML = rowsHtml;

  let summaryHtml = "";
  if (wGoal > 0) {
    const n = assessed.length;
    const goalsUsed = [...new Set(assessed.map(r => r.wGoal).filter(g => g > 0))];
    summaryHtml += goalsUsed.length === 1
      ? `<span><strong>${hitCount}</strong> of ${n} weeks hit goal of <strong>${goalsUsed[0]}</strong></span>`
      : `<span><strong>${hitCount}</strong> of ${n} weeks hit their goal</span>`;
    if (n > 0) summaryHtml += `<span>hit rate: <strong>${Math.round(hitCount/n*100)}%</strong></span>`;
    let wStreak = 0;
    for (let i = assessed.length-1; i >= 0; i--) {
      if (assessed[i].isHit) wStreak++; else break;
    }
    if (wStreak > 0) summaryHtml += `<span>weekly streak: <strong>${wStreak}wk</strong></span>`;
  } else {
    summaryHtml = `<span>set a weekly goal to track hit/miss</span>`;
  }
  document.getElementById("week-summary").innerHTML = summaryHtml;
}

/* ── Streak ── */
function calcStreaks() {
  const keys = Object.keys(data).filter(k => data[k] > 0).sort();
  if (!keys.length) return { current: 0, longest: 0 };
  let longest = 1, cur = 1;
  for (let i = 1; i < keys.length; i++) {
    // parseDate anchors at local noon; Math.round absorbs DST-induced 23/25h days
    const diff = Math.round((parseDate(keys[i]) - parseDate(keys[i-1])) / 86400000);
    if (diff === 1) { cur++; longest = Math.max(longest, cur); } else { cur = 1; }
  }
  let d = parseDate(today()), streak = 0;
  while (true) {
    const k = fmtDate(d);
    if (data[k] && data[k] > 0) { streak++; d.setDate(d.getDate()-1); } else break;
  }
  return { current: streak, longest };
}

function updateStreak() {
  const { current, longest } = calcStreaks();
  const isActive = current > 0;

  // week-over-week trend
  const ws = getWeekStart();
  const lastWs = parseDate(ws);
  lastWs.setDate(lastWs.getDate() - 7);
  const thisWeekTotal = getWeekTotal(ws);
  const lastWeekTotal = getWeekTotal(fmtDate(lastWs));
  let trendHtml = "";
  if (lastWeekTotal > 0) {
    const diff = thisWeekTotal - lastWeekTotal;
    const pct = Math.round(Math.abs(diff) / lastWeekTotal * 100);
    if (diff > 0)      trendHtml = `<div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div><div class="streak-item"><span style="color:var(--accent);font-family:var(--font-mono);font-size:12px">↑ ${pct}% vs last week</span></div>`;
    else if (diff < 0) trendHtml = `<div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div><div class="streak-item"><span style="color:#f0a500;font-family:var(--font-mono);font-size:12px">↓ ${pct}% vs last week</span></div>`;
    else               trendHtml = `<div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div><div class="streak-item"><span style="color:var(--muted);font-family:var(--font-mono);font-size:12px">= same as last week</span></div>`;
  }
  document.getElementById("streak-bar").innerHTML = `
    <div class="streak-item">
      <div class="streak-dot${isActive?'':' cold'}"></div>
      <span class="streak-num${isActive?'':' cold'}">${current}</span>
      <span class="streak-label">day streak</span>
    </div>
    <div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div>
    <div class="streak-item">
      <div class="streak-dot" style="background:var(--muted)"></div>
      <span class="streak-num" style="color:var(--muted)">${longest}</span>
      <span class="streak-label">longest streak</span>
    </div>
    <div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div>
    <div class="streak-item">
      <span class="streak-label">${isActive ? '🔥 keep going' : 'apply today to start a streak'}</span>
    </div>
    ${trendHtml}`;
}

/* ── Grid ── */
function buildGrid() {
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const now = new Date();
  const months = [];
  let my = 2026, mm = 2;
  while (my < now.getFullYear() || (my === now.getFullYear() && mm <= now.getMonth())) {
    months.push({y:my, m:mm});
    mm++; if (mm > 11) { mm = 0; my++; }
  }
  const nextM = now.getMonth() + 1 > 11 ? 0 : now.getMonth() + 1;
  const nextY = now.getMonth() + 1 > 11 ? now.getFullYear() + 1 : now.getFullYear();
  months.push({y:nextY, m:nextM, viewOnly:true});

  const todayKey = today();
  let html = "";
  months.forEach(({y,m,viewOnly}) => {
    const days = new Date(y, m+1, 0).getDate();
    const headerSuffix = viewOnly ? ' <span style="font-size:9px;color:var(--muted);margin-left:6px">view only</span>' : '';
    html += `<div class="month-block"><div class="month-header">${monthNames[m]} ${y}${headerSuffix}</div><div class="day-row">`;
    for (let d = 1; d <= days; d++) {
      const date = new Date(y, m, d);
      const key  = toKey(date);
      const count = data[key] || 0;
      const lvl   = getLevel(count);
      const isToday = key === todayKey ? " today" : "";
      const dayName = date.toLocaleDateString("en-US",{weekday:"short"});
      const tipText = count > 0 ? `${dayName} ${d}: ${count} app${count!==1?"s":""}` : `${dayName} ${d}`;
      const cellStyle = viewOnly ? ' style="cursor:default;opacity:0.45"' : '';
      const cellClick = viewOnly ? '' : `onclick="showDayRings('${key}')"`;
      html += `<div class="day-cell ${lvl}${isToday}" ${cellClick}${cellStyle} data-key="${key}">${d}<div class="tip">${tipText}</div></div>`;
    }
    html += `</div></div>`;
  });
  document.getElementById("grid-wrap").innerHTML = html;
}

/* ── Monthly chart ── */
function buildMonthlyChart() {
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const now = new Date();
  const months = [];
  let my = 2026, mm = 2;
  while (my < now.getFullYear() || (my === now.getFullYear() && mm <= now.getMonth())) {
    months.push({y:my, m:mm});
    mm++; if (mm > 11) { mm = 0; my++; }
  }

  const labels = months.map(({y,m}) => monthNames[m] + (y !== 2026 ? " '"+String(y).slice(2) : ""));
  const vals   = months.map(({y,m}) => {
    const prefix = `${y}-${String(m+1).padStart(2,'0')}`;
    return Object.entries(data).filter(([k,v]) => k.startsWith(prefix) && v > 0).reduce((a,[,v])=>a+v, 0);
  });

  const maxVal = Math.max(...vals, 1);
  const colors = vals.map(v => {
    if (!v) return "#1b1e1c";
    const r = v / maxVal;
    if (r < 0.25) return "#0d5c30";
    if (r < 0.5)  return "#1a9e55";
    if (r < 0.75) return "#2ecc71";
    return "#3ddc84";
  });

  if (monthlyChart) monthlyChart.destroy();
  monthlyChart = new Chart(document.getElementById("monthly-chart"), {
    type: "bar",
    data: { labels, datasets: [{ data: vals, backgroundColor: colors, borderRadius: 3, borderSkipped: false }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1b1e1c", borderColor: "rgba(255,255,255,0.1)", borderWidth: 1,
          titleColor: "#3ddc84", bodyColor: "#e8ede9",
          titleFont: { family: "'DM Mono', monospace", size: 11 },
          bodyFont:  { family: "'DM Mono', monospace", size: 11 },
          callbacks: { label: ctx => ` ${ctx.parsed.y} applications` }
        }
      },
      scales: {
        x: { ticks: { color: "#6b7a6d", font: { family: "'DM Mono', monospace", size: 10 } }, grid: { color: "rgba(255,255,255,0.04)" } },
        y: { ticks: { color: "#6b7a6d", font: { family: "'DM Mono', monospace", size: 10 }, stepSize: 10 }, grid: { color: "rgba(255,255,255,0.04)" }, min: 0 }
      }
    }
  });
}

/* ── Weekly chart ── */
function buildWeeklyChart() {
  const todayDate = new Date();
  const ws = new Date(todayDate);
  ws.setDate(ws.getDate() - ws.getDay());
  const weeks = [];
  for (let i = 11; i >= 0; i--) {
    const start = new Date(ws);
    start.setDate(start.getDate() - i * 7);
    const label = start.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    let total = 0;
    for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setDate(day.getDate() + d);
      total += data[toKey(day)] || 0;
    }
    weeks.push({ label, total });
  }
  const labels = weeks.map(w => w.label);
  const vals   = weeks.map(w => w.total);
  const maxVal = Math.max(...vals, 1);
  const colors = vals.map(v => {
    if (!v) return "#1b1e1c";
    const r = v / maxVal;
    if (r < 0.25) return "#0d5c30";
    if (r < 0.5)  return "#1a9e55";
    if (r < 0.75) return "#2ecc71";
    return "#3ddc84";
  });
  if (weeklyChart) weeklyChart.destroy();
  weeklyChart = new Chart(document.getElementById("weekly-chart"), {
    type: "bar",
    data: { labels, datasets: [{ data: vals, backgroundColor: colors, borderRadius: 3, borderSkipped: false }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1b1e1c", borderColor: "rgba(255,255,255,0.1)", borderWidth: 1,
          titleColor: "#3ddc84", bodyColor: "#e8ede9",
          titleFont: { family: "'DM Mono', monospace", size: 11 },
          bodyFont:  { family: "'DM Mono', monospace", size: 11 },
          callbacks: { label: ctx => ` ${ctx.parsed.y} applications` }
        }
      },
      scales: {
        x: { ticks: { color: "#6b7a6d", font: { family: "'DM Mono', monospace", size: 10 }, maxRotation: 45 }, grid: { color: "rgba(255,255,255,0.04)" } },
        y: { ticks: { color: "#6b7a6d", font: { family: "'DM Mono', monospace", size: 10 }, stepSize: 5  }, grid: { color: "rgba(255,255,255,0.04)" }, min: 0 }
      }
    }
  });
}

/* ── Render ── */
function render() {
  // always refresh max date so tabs open past midnight stay correct
  const inpDate = document.getElementById("inp-date");
  const t = today();
  inpDate.max = t;
  if (inpDate.value > t) inpDate.value = t;
  updateStats();
  updateStreak();
  updateGoal();
  buildWeeklyGoalHistory();
  buildGrid();
  buildMonthlyChart();
  buildWeeklyChart();
}

/* ── Actions ── */
function clickCell(key) {
  if (key > today()) return;
  document.getElementById("inp-date").value = key;
  document.getElementById("inp-count").focus();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function logApps() {
  const key = document.getElementById("inp-date").value;
  const n   = parseInt(document.getElementById("inp-count").value) || 0;
  const t   = today();
  if (!key || n === 0 || key > t) return;
  data[key] = (data[key] || 0) + n;
  save(); render();
  showToast(`+${n} logged`);
  document.getElementById("inp-count").value = 1;
  // reset date input to today and refresh max (handles tabs open past midnight)
  const inpDate = document.getElementById("inp-date");
  inpDate.max = t;
  // only reset to today if user was on today — preserve intentional past-day selection
  if (key === t) inpDate.value = t;
}

function setApps() {
  const key = document.getElementById("inp-date").value;
  const n   = parseInt(document.getElementById("inp-count").value);
  if (!key || isNaN(n) || key > today()) return;
  data[key] = n;
  save(); render();
  showToast(`set to ${n}`);
}

/* ── Export ── */
function exportCSV() {
  const rows = [["date","applications"]];
  const sorted = Object.keys(data).filter(k => data[k] > 0).sort();
  sorted.forEach(k => rows.push([k, data[k]]));
  const csv = rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "job-applications.csv";
  a.click();
  URL.revokeObjectURL(url);
  showToast("csv exported");
}

/* ── Ring tooltips ── */
let _ringTipData = {};
function updateRingTipData(type, current, target, msg) {
  _ringTipData[type] = { current, target, msg };
}
function showRingTip(type) {
  const d = _ringTipData[type] || {};
  const colors = { daily: '#ff453a', weekly: '#ffd60a', monthly: '#3ddc84' };
  const tip = document.getElementById('ring-tooltip');
  document.getElementById('rtt-label').textContent = type;
  const val = document.getElementById('rtt-val');
  val.textContent = d.target ? `${d.current} / ${d.target}` : d.current;
  val.style.color = colors[type];
  document.getElementById('rtt-msg').textContent = d.msg || '';
  tip.classList.add('visible');
}
function hideRingTip() {
  document.getElementById('ring-tooltip').classList.remove('visible');
}

/* ── Per-day rings modal ── */
let dayModalKey = null;
function showDayRings(key) {
  dayModalKey = key;
  const g = goalOn(key); // goals that were in effect on this date
  const dailyCount = data[key] || 0;
  // Weekly/monthly reflect progress AS OF that day — cumulative from the start of
  // the week/month through the clicked day (inclusive), not the whole period.
  const wStart = parseDate(getWeekStart(key));
  let weekCount = 0;
  for (let i = 0; i < 7; i++) {
    const day = new Date(wStart); day.setDate(day.getDate() + i);
    const dk = fmtDate(day);
    if (dk > key) break;
    weekCount += data[dk] || 0;
  }
  const prefix     = key.slice(0, 7);
  const monthCount = Object.entries(data).filter(([k,v]) => k.startsWith(prefix) && v > 0 && k <= key).reduce((a,[,v])=>a+v, 0);

  const rows = [
    ["daily",   dailyCount,  g.daily   || 0, "#ff453a"],
    ["weekly",  weekCount,   g.weekly  || 0, "#ffd60a"],
    ["monthly", monthCount,  g.monthly || 0, "#3ddc84"]
  ];

  rows.forEach(([type, current, target]) => {
    const c = RING_C[type];
    const rawPct = target > 0 ? current / target * 100 : 0;
    document.getElementById("dm-ring-"+type).style.strokeDashoffset = c - Math.min(1, rawPct/100) * c;
  });
  document.getElementById("dm-center-val").textContent = dailyCount;

  const d = parseDate(key);
  document.getElementById("day-modal-title").textContent =
    d.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });

  document.getElementById("dm-legend").innerHTML = rows.map(([type, current, target, color]) => {
    const label = type.charAt(0).toUpperCase() + type.slice(1);
    let pctText;
    if (!target) pctText = "no goal set";
    else { const pct = Math.round(current/target*100); pctText = pct + "%" + (current >= target ? " · goal hit 🎉" : ""); }
    return `<div class="ring-leg"><div class="ring-leg-row">
      <div class="ring-dot" style="background:${color}"></div>
      <span class="ring-leg-label">${label}</span>
      <span class="ring-leg-nums" style="color:${color}">${current} / ${target || "—"}</span>
    </div><div class="ring-leg-msg">${pctText}</div></div>`;
  }).join("");

  document.getElementById("day-modal").classList.add("visible");
}
function closeDayRings() {
  document.getElementById("day-modal").classList.remove("visible");
  dayModalKey = null;
}
function logFromModal() {
  const key = dayModalKey;
  closeDayRings();
  if (!key) return;
  switchTab('log');
  clickCell(key);
}

/* ── Tabs ── */
function switchTab(name) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  document.querySelector(`.tab-btn[onclick="switchTab('${name}')"]`).classList.add('active');
  // rebuild charts when switching to stats so canvas renders at correct size
  if (name === 'stats') { buildMonthlyChart(); buildWeeklyChart(); }
}

/* ── Init ── */
document.getElementById("header-date").textContent = new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}).toLowerCase();
const inpDate = document.getElementById("inp-date");
inpDate.value = today();
inpDate.max   = today();
document.getElementById("inp-count").addEventListener("keydown", e => { if (e.key === "Enter") logApps(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDayRings(); });

load();
render();
tryRestoreFileHandle().then(() => render());
</script>
